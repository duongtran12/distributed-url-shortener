spring:
  application:
    name: url-shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:PT2S}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:url_shortener}
    password: ${RABBITMQ_PASSWORD:url_shortener_local}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          max-interval: 10s
          multiplier: 2

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NATIVE}

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8080}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:P30D}
    secure-cookie: ${REFRESH_TOKEN_SECURE_COOKIE:false}
    max-active-sessions: ${REFRESH_TOKEN_MAX_ACTIVE_SESSIONS:5}
  refresh-token-cleanup:
    enabled: ${REFRESH_TOKEN_CLEANUP_ENABLED:true}
    retention: ${REFRESH_TOKEN_CLEANUP_RETENTION:P7D}
    batch-size: ${REFRESH_TOKEN_CLEANUP_BATCH_SIZE:500}
    initial-delay: ${REFRESH_TOKEN_CLEANUP_INITIAL_DELAY:PT5M}
    interval: ${REFRESH_TOKEN_CLEANUP_INTERVAL:PT24H}
  password-reset:
    expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/}
    from-address: ${PASSWORD_RESET_FROM_ADDRESS:no-reply@shortwave.local}
  password-reset-cleanup:
    enabled: ${PASSWORD_RESET_CLEANUP_ENABLED:true}
    retention: ${PASSWORD_RESET_CLEANUP_RETENTION:P7D}
    batch-size: ${PASSWORD_RESET_CLEANUP_BATCH_SIZE:500}
    initial-delay: ${PASSWORD_RESET_CLEANUP_INITIAL_DELAY:PT5M}
    interval: ${PASSWORD_RESET_CLEANUP_INTERVAL:PT24H}
  email-verification:
    expiration: ${EMAIL_VERIFICATION_EXPIRATION:PT24H}
    frontend-url: ${EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:5173/}
    from-address: ${EMAIL_VERIFICATION_FROM_ADDRESS:no-reply@shortwave.local}
  registration-cleanup:
    enabled: ${REGISTRATION_CLEANUP_ENABLED:true}
    retention: ${REGISTRATION_CLEANUP_RETENTION:P7D}
    batch-size: ${REGISTRATION_CLEANUP_BATCH_SIZE:500}
    initial-delay: ${REGISTRATION_CLEANUP_INITIAL_DELAY:PT5M}
    interval: ${REGISTRATION_CLEANUP_INTERVAL:PT24H}
  short-url:
    code-length: ${SHORT_CODE_LENGTH:7}
    max-generation-attempts: ${SHORT_CODE_MAX_GENERATION_ATTEMPTS:5}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  redirect-cache:
    enabled: ${REDIRECT_CACHE_ENABLED:true}
    ttl: ${REDIRECT_CACHE_TTL:PT1H}
  expiration-cleanup:
    enabled: ${EXPIRATION_CLEANUP_ENABLED:true}
    initial-delay: ${EXPIRATION_CLEANUP_INITIAL_DELAY:PT1M}
    interval: ${EXPIRATION_CLEANUP_INTERVAL:PT5M}
  audit-retention:
    enabled: ${AUDIT_RETENTION_ENABLED:true}
    retention: ${AUDIT_RETENTION_PERIOD:P365D}
    batch-size: ${AUDIT_RETENTION_BATCH_SIZE:500}
    initial-delay: ${AUDIT_RETENTION_INITIAL_DELAY:PT5M}
    interval: ${AUDIT_RETENTION_INTERVAL:PT24H}
  click-tracking:
    enabled: ${CLICK_TRACKING_ENABLED:true}
    exchange: url-shortener.clicks
    queue: url-shortener.clicks.count.v2
    routing-key: click.recorded
    dead-letter-exchange: url-shortener.clicks.dlx
    dead-letter-queue: url-shortener.clicks.dead
    dead-letter-routing-key: click.dead
  click-event-retention:
    enabled: ${CLICK_EVENT_RETENTION_ENABLED:true}
    retention: ${CLICK_EVENT_RETENTION_PERIOD:P365D}
    batch-size: ${CLICK_EVENT_RETENTION_BATCH_SIZE:500}
    initial-delay: ${CLICK_EVENT_RETENTION_INITIAL_DELAY:PT5M}
    interval: ${CLICK_EVENT_RETENTION_INTERVAL:PT24H}
  visitor-fingerprint:
    secret: ${VISITOR_HASH_SECRET:${app.jwt.secret}}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    window: ${RATE_LIMIT_WINDOW:PT1M}
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
    redirect-requests: ${RATE_LIMIT_REDIRECT_REQUESTS:60}
    api-requests: ${RATE_LIMIT_API_REQUESTS:120}
