spring:
  application:
    name: url-shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:PT2S}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:url_shortener}
    password: ${RABBITMQ_PASSWORD:url_shortener_local}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
  short-url:
    code-length: ${SHORT_CODE_LENGTH:7}
    max-generation-attempts: ${SHORT_CODE_MAX_GENERATION_ATTEMPTS:5}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  redirect-cache:
    enabled: ${REDIRECT_CACHE_ENABLED:true}
    ttl: ${REDIRECT_CACHE_TTL:PT1H}
  click-tracking:
    enabled: ${CLICK_TRACKING_ENABLED:true}
    exchange: url-shortener.clicks
    queue: url-shortener.clicks.count
    routing-key: click.recorded
