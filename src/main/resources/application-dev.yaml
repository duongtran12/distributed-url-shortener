spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url_shortener}
    username: ${SPRING_DATASOURCE_USERNAME:url_shortener}
    password: ${SPRING_DATASOURCE_PASSWORD:url_shortener_local}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
