spring:
  jpa:
    show-sql: false

logging:
  level:
    org.testcontainers: INFO

app:
  jwt:
    secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    access-token-expiration: PT15M
  redirect-cache:
    enabled: false
    ttl: PT1H
  click-tracking:
    enabled: false
    exchange: url-shortener.clicks
    queue: url-shortener.clicks.count.v2
    routing-key: click.recorded
    dead-letter-exchange: url-shortener.clicks.dlx
    dead-letter-queue: url-shortener.clicks.dead
    dead-letter-routing-key: click.dead
