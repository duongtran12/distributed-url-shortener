spring:
  jpa:
    show-sql: false

logging:
  level:
    org.testcontainers: INFO

app:
  jwt:
    secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    access-token-expiration: PT15M
  redirect-cache:
    enabled: false
    ttl: PT1H
  expiration-cleanup:
    enabled: false
  audit-retention:
    enabled: false
    retention: P365D
    batch-size: 500
  click-tracking:
    enabled: false
    exchange: url-shortener.clicks
    queue: url-shortener.clicks.count.v2
    routing-key: click.recorded
    dead-letter-exchange: url-shortener.clicks.dlx
    dead-letter-queue: url-shortener.clicks.dead
    dead-letter-routing-key: click.dead
  visitor-fingerprint:
    secret: test-visitor-fingerprint-secret-with-32-characters
  rate-limit:
    enabled: false
    fail-open: true
    window: PT1M
    auth-requests: 10
    redirect-requests: 60
    api-requests: 120
