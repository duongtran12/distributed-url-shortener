services:
  postgres:
    image: postgres:17-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: url-shortener-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: url-shortener-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-url_shortener}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-url_shortener_local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: url-shortener-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-url_shortener}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-url_shortener_local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-P30D}
      REFRESH_TOKEN_SECURE_COOKIE: ${REFRESH_TOKEN_SECURE_COOKIE:-false}
      REFRESH_TOKEN_MAX_ACTIVE_SESSIONS: ${REFRESH_TOKEN_MAX_ACTIVE_SESSIONS:-5}
      REFRESH_TOKEN_CLEANUP_ENABLED: ${REFRESH_TOKEN_CLEANUP_ENABLED:-true}
      REFRESH_TOKEN_CLEANUP_RETENTION: ${REFRESH_TOKEN_CLEANUP_RETENTION:-P7D}
      REFRESH_TOKEN_CLEANUP_BATCH_SIZE: ${REFRESH_TOKEN_CLEANUP_BATCH_SIZE:-500}
      REFRESH_TOKEN_CLEANUP_INITIAL_DELAY: ${REFRESH_TOKEN_CLEANUP_INITIAL_DELAY:-PT5M}
      REFRESH_TOKEN_CLEANUP_INTERVAL: ${REFRESH_TOKEN_CLEANUP_INTERVAL:-PT24H}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      PASSWORD_RESET_EXPIRATION: ${PASSWORD_RESET_EXPIRATION:-PT30M}
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:${APP_PORT:-8080}/}
      PASSWORD_RESET_FROM_ADDRESS: ${PASSWORD_RESET_FROM_ADDRESS:-no-reply@shortwave.local}
      PASSWORD_RESET_CLEANUP_ENABLED: ${PASSWORD_RESET_CLEANUP_ENABLED:-true}
      PASSWORD_RESET_CLEANUP_RETENTION: ${PASSWORD_RESET_CLEANUP_RETENTION:-P7D}
      PASSWORD_RESET_CLEANUP_BATCH_SIZE: ${PASSWORD_RESET_CLEANUP_BATCH_SIZE:-500}
      PASSWORD_RESET_CLEANUP_INITIAL_DELAY: ${PASSWORD_RESET_CLEANUP_INITIAL_DELAY:-PT5M}
      PASSWORD_RESET_CLEANUP_INTERVAL: ${PASSWORD_RESET_CLEANUP_INTERVAL:-PT24H}
      VISITOR_HASH_SECRET: ${VISITOR_HASH_SECRET:-${JWT_SECRET}}
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}
      FORWARD_HEADERS_STRATEGY: NATIVE
      MANAGEMENT_SERVER_PORT: 8081
      REDIRECT_CACHE_ENABLED: ${REDIRECT_CACHE_ENABLED:-true}
      CLICK_TRACKING_ENABLED: ${CLICK_TRACKING_ENABLED:-true}
      CLICK_EVENT_RETENTION_ENABLED: ${CLICK_EVENT_RETENTION_ENABLED:-true}
      CLICK_EVENT_RETENTION_PERIOD: ${CLICK_EVENT_RETENTION_PERIOD:-P365D}
      CLICK_EVENT_RETENTION_BATCH_SIZE: ${CLICK_EVENT_RETENTION_BATCH_SIZE:-500}
      CLICK_EVENT_RETENTION_INITIAL_DELAY: ${CLICK_EVENT_RETENTION_INITIAL_DELAY:-PT5M}
      CLICK_EVENT_RETENTION_INTERVAL: ${CLICK_EVENT_RETENTION_INTERVAL:-PT24H}
      AUDIT_RETENTION_ENABLED: ${AUDIT_RETENTION_ENABLED:-true}
      AUDIT_RETENTION_PERIOD: ${AUDIT_RETENTION_PERIOD:-P365D}
      AUDIT_RETENTION_BATCH_SIZE: ${AUDIT_RETENTION_BATCH_SIZE:-500}
      AUDIT_RETENTION_INITIAL_DELAY: ${AUDIT_RETENTION_INITIAL_DELAY:-PT5M}
      AUDIT_RETENTION_INTERVAL: ${AUDIT_RETENTION_INTERVAL:-PT24H}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
    expose:
      - "8080"
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
