name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Maven verification
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate operations scripts
        shell: pwsh
        run: |
          $scriptErrors = @()
          Get-ChildItem ops -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $scriptErrors += $errors
          }
          if ($scriptErrors.Count -gt 0) {
            $scriptErrors | ForEach-Object { Write-Error $_ }
            throw 'PowerShell operations script validation failed.'
          }

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend end-to-end tests
        run: npm run test:e2e

  containers:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ci
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: ci-postgres-password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
      CLICK_TRACKING_ENABLED: "false"
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate production Docker Compose
        shell: pwsh
        run: |
          $production = docker compose --env-file .env.production.example -f docker-compose.yml -f docker-compose.production.yml config --format json | ConvertFrom-Json
          if ($production.services.postgres.ports) { throw 'PostgreSQL must not publish production ports.' }
          if ($production.services.redis.ports) { throw 'Redis must not publish production ports.' }
          if ($production.services.rabbitmq.ports) { throw 'RabbitMQ must not publish production ports.' }
          if ($production.services.mailpit) { throw 'Mailpit must not run in production.' }
          if ($production.services.backend.build) { throw 'Production backend must use a registry image.' }
          if ($production.services.nginx.build) { throw 'Production frontend must use a registry image.' }
          if ($production.services.prometheus.ports[0].host_ip -ne '127.0.0.1') { throw 'Prometheus must bind to loopback.' }
          if ($production.services.grafana.ports[0].host_ip -ne '127.0.0.1') { throw 'Grafana must bind to loopback.' }

      - name: Validate k6 load test
        run: docker run --rm -v "${{ github.workspace }}/load-testing:/scripts:ro" grafana/k6:2.1.0 inspect /scripts/redirect.js

      - name: Build backend image
        run: docker build --tag url-shortener-backend:ci .

      - name: Build frontend image
        run: docker build --tag url-shortener-frontend:ci frontend

      - name: Start application stack
        run: docker compose up -d --wait postgres redis rabbitmq mailpit backend nginx

      - name: Run Docker stack smoke test
        shell: pwsh
        run: ./ops/smoke-test.ps1

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail 200 backend nginx postgres redis rabbitmq

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
